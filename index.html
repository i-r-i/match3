<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dedlck games</title>
<style>
  :root { --bg:#151311; --panel:#584134; --text:#ded2c1; --cream:#efdfc0; --accent:#4e7958; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:48px 16px; gap:36px; isolation:isolate; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:url("logo.png") center / min(90vmin,800px) no-repeat;
    filter:brightness(0) drop-shadow(0 1px 0 rgba(255,255,255,.35)); opacity:.5; }
  h1 { margin:0; font:700 clamp(2rem,6vw,3.2rem)/1 Georgia,"Times New Roman",serif; color:var(--cream); letter-spacing:.04em; }
  .games { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
  .game { position:relative; isolation:isolate; display:block; width:260px; padding:26px 24px 28px; text-decoration:none; color:var(--cream); }
  .game::before { content:""; position:absolute; inset:0; z-index:-1; background:var(--panel); filter:url(#chip); transition:background .15s; }
  .game::after { content:""; position:absolute; left:9px; top:16px; bottom:16px; width:5px; background:var(--cream); filter:url(#chip); }
  .game:hover::before, .game:focus-visible::before { background:#6b5041; }
  .game:focus-visible { outline:3px solid #fff; outline-offset:4px; }
  .game b { display:block; font:700 1.7rem/1.1 Georgia,"Times New Roman",serif; margin:0 0 8px 10px; }
  .game span { display:block; margin-left:10px; opacity:.85; line-height:1.4; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="chip" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="1" seed="2" result="n"/>
    <feComponentTransfer in="n" result="q"><feFuncR type="discrete" tableValues=".5 .2 .8 1"/><feFuncG type="discrete" tableValues=".5 .8 .2 0"/></feComponentTransfer>
    <feDisplacementMap in="SourceGraphic" in2="q" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<h1>dedlck</h1>
<div class="games">
  <a class="game" href="match3/"><b>crush</b><span>Matchmaking.</span></a>
  <a class="game" href="x/"><b>wip</b><span>and business is *waching* good</span></a>
</div>
</body>
</html>
